<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="kenzakiABE9 图形生成库">
  <title>kenzakiABE9 图形生成库</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e08a5f"/>
      <stop offset="1" stop-color="#c96a41"/>
    </linearGradient>
  </defs>

  <!-- 底板：超椭圆近似（半径 13 / 边长 48） -->
  <rect width="48" height="48" rx="13" ry="13" fill="url(#tile)"/>

  <!-- 字母 K：一竖 + 两条波浪臂，象征「图形生成」 -->
  <g fill="none" stroke="#fdf6df" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.2 13.4 V34.6"/>
    <path d="M16.2 24 C 21.4 23.4, 23.8 16.3, 30.2 13.6"/>
    <path d="M16.2 24 C 21.4 24.6, 23.8 31.7, 30.2 34.4"/>
  </g>

  <!-- 波点：呼应点阵/波形 -->
  <circle cx="32.4" cy="13.2" r="2.4" fill="#8bd1d8"/>
  </svg>
