<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Style Toolkit · 可参数化的网页样式组件集</title>
<meta name="description" content="A small collection of live, parameter-driven web style components. 纯静态、无构建、可单独嵌入。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314171b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d97a4f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/catalog.css">
</head>
<body>

<header class="hero">
  <div class="hero-top">
    <div class="brand"><span class="dot"></span><span id="brand-name">Dynamic Style Toolkit</span></div>
    <button id="theme-btn" class="ghost-btn" title="切换明/暗">◐ 明暗</button>
  </div>

  <h1 class="title">
    <span class="line">Playful,</span>
    <span class="line">parameter-driven</span>
    <span class="line"><em>style components.</em></span>
  </h1>

  <p class="lede" id="tagline">A small collection of live, parameter-driven web style components.</p>

  <div class="meta">
    <span id="app-count">— 个应用</span>
    <span class="sep"></span>
    <span>纯静态 · 无构建 · 可直接嵌入</span>
    <span class="sep"></span>
    <a href="https://github.com/ABE9-mix/dynamicstyle-toolkit" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
</header>

<main class="grid" id="grid" aria-label="应用列表"></main>

<footer class="foot">
  <span>Dynamic Style Toolkit</span>
  <span class="sep"></span>
  <span>新增应用：把目录放进 <code>apps/</code>，再往 <code>apps.json</code> 加一条</span>
</footer>

<script src="assets/catalog.js"></script>
</body>
</html>
